<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CleanYourTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop"></div>
  <main id="shell">
    <header>
      <div class="brandBlock">
        <div class="brand">CleanYourTV</div>
        <div class="subtitle">Samsung Tizen • Minimal launcher</div>
      </div>
      <div class="clockBlock">
        <div id="clock">--:--</div>
        <div id="date">---</div>
      </div>
    </header>

    <section class="hero">
      <div id="focusedName">Loading apps...</div>
      <div id="focusedMeta">Tizen launcher</div>
    </section>

    <section class="section">
      <div class="sectionHeader">
        <div class="sectionTitle">Favorites</div>
        <div id="favoriteCount" class="sectionMeta"></div>
      </div>
      <div id="favorites" class="favorites"></div>
    </section>

    <section class="section appsSection">
      <div class="sectionHeader">
        <div class="sectionTitle">All apps</div>
        <div id="pageInfo" class="sectionMeta"></div>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <footer>
      <span><b>←↑↓→</b> Move</span>
      <span><b>OK</b> Open</span>
      <span class="green"><b>●</b> Pin/Unpin</span>
      <span class="red"><b>●</b> Prev page</span>
      <span class="blue"><b>●</b> Next page</span>
      <span class="yellow"><b>●</b> Refresh</span>
      <span><b>BACK</b> TizenBrew</span>
    </footer>

    <div id="toast"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
